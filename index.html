<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%2314213d'/%3E%3Cg fill='none' stroke-width='2.2' stroke-linecap='round'%3E%3Cpath class='w w1' d='M14.5 15.5a7.8 7.8 0 0 1 11 0' stroke='%2314b8a6'/%3E%3Cpath class='w w2' d='M11.4 12.4a12.2 12.2 0 0 1 17.2 0' stroke='%23818cf8'/%3E%3Cpath class='w w3' d='M8.3 9.3a16.6 16.6 0 0 1 23.4 0' stroke='%23f59e0b'/%3E%3C/g%3E%3Crect x='11.5' y='23.2' width='2.6' height='5' rx='1.2' fill='%23f472b6'/%3E%3Crect x='25.9' y='23.2' width='2.6' height='5' rx='1.2' fill='%23f472b6'/%3E%3Crect x='11.5' y='30.4' width='2.6' height='4.4' rx='1.2' fill='%23f472b6'/%3E%3Crect x='25.9' y='30.4' width='2.6' height='4.4' rx='1.2' fill='%23f472b6'/%3E%3Crect x='13.4' y='19.5' width='13.2' height='17' rx='4.6' fill='%23fff'/%3E%3Crect x='15.4' y='22.6' width='9.2' height='3.6' rx='1.4' fill='%2314213d' opacity='.85'/%3E%3Ccircle cx='20' cy='19.6' r='2.3' fill='%23fff' stroke='%2314213d' stroke-width='1.2'/%3E%3C/svg%3E">
<title>Carlos Conejo Barceló · Automática, control y robótica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213d; --ink-2:#3b4660; --muted:#6b7488;
  --bg:#f7f5f0; --paper:#ffffff; --line:#e4e0d6;
  --accent:#0f766e; --accent-2:#14b8a6; --accent-soft:#e6f4f2;
  --warm:#c2410c; --warm-soft:#fdf0e8;
  --c-doc:#0f766e; --c-doc-soft:#e6f4f2;
  --c-inv:#4f46e5; --c-inv-soft:#eceafd;
  --c-pro:#b45309; --c-pro-soft:#fbf1e3;
  --c-for:#be185d; --c-for-soft:#fce7f3;
  --radius:14px; --shadow:0 1px 2px rgba(20,33,61,.06),0 8px 24px rgba(20,33,61,.06);
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,-apple-system,sans-serif;
}
body[data-view=investigacion]{--accent:var(--c-inv);--accent-2:#818cf8;--accent-soft:var(--c-inv-soft)}
body[data-view=formacion]{--accent:var(--c-for);--accent-2:#f472b6;--accent-soft:var(--c-for-soft)}
body[data-view=profesional]{--accent:var(--c-pro);--accent-2:#f59e0b;--accent-soft:var(--c-pro-soft)}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.65;font-size:17px;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--serif);line-height:1.15;margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:clamp(1.8rem,3.4vw,2.5rem)}
h3{font-size:1.28rem}
p{margin:0 0 1em}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}

/* top bar */
#progress{position:fixed;top:0;left:0;height:3px;background:var(--accent-2);width:0;z-index:70}
header.top{position:sticky;top:0;z-index:60;background:rgba(247,245,240,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .topbar{display:flex;align-items:center;gap:16px;height:60px}
.brand{font-family:var(--serif);font-weight:600;white-space:nowrap;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px}
.brand img{width:32px;height:32px;border-radius:50%;object-fit:cover;object-position:50% 20%}
.brand .logo{display:block;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.brand:hover .logo{transform:translateY(-2px) rotate(-4deg)}
.brand .logo .w{animation:scan 2.4s ease-in-out infinite;opacity:.25}
.brand .logo .w2{animation-delay:.25s}.brand .logo .w3{animation-delay:.5s}
@keyframes scan{0%,100%{opacity:.2}35%{opacity:1}}
.hero h1 .dr{color:var(--accent)}
.views{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.views a{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-size:.9rem;font-weight:500;color:var(--ink-2);text-decoration:none;white-space:nowrap;transition:background .2s,color .2s}
.views a i{width:8px;height:8px;border-radius:50%;display:inline-block}
.views a:hover{background:#ece8de}
.views a.on{background:var(--ink);color:#fff}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper)}
.langs button{appearance:none;border:0;background:none;font:inherit;font-size:.78rem;font-weight:600;padding:4px 9px;border-radius:999px;cursor:pointer;color:var(--muted);letter-spacing:.04em}
.langs button[aria-pressed=true]{background:var(--accent);color:#fff}
.subnav{border-top:1px solid var(--line);display:none}
.subnav.on{display:block}
.subnav ul{display:flex;gap:4px;list-style:none;margin:0;padding:7px 0;overflow-x:auto;scrollbar-width:none}
.subnav ul::-webkit-scrollbar{display:none}
.subnav button{appearance:none;border:0;background:none;font:inherit;font-size:.82rem;padding:4px 10px;border-radius:999px;color:var(--muted);cursor:pointer;white-space:nowrap}
.subnav button:hover{color:var(--ink)}
.subnav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
@media (max-width:600px){header.top .topbar{flex-wrap:wrap;height:auto;padding-top:8px;padding-bottom:6px;row-gap:6px}.brand span{display:inline;font-size:.95rem}.langs{margin-left:auto}.views{order:3;width:100%;margin-left:0}.views a{padding:5px 9px!important;font-size:.82rem!important}html{scroll-padding-top:150px}}
@media (max-width:760px){.brand span{font-size:.95rem}header.top .topbar{gap:10px}.views a{padding:6px 10px;font-size:.84rem}.views a i{display:none}}

/* hero */
.hero{padding:64px 0 52px}
.hero .grid{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:14px}
.hero h1{font-size:clamp(2.3rem,5.2vw,3.8rem);font-weight:700}
.hero .role{font-size:1.08rem;color:var(--ink-2);margin:16px 0 24px}
.lead{font-family:var(--serif);font-size:1.32rem;line-height:1.45;color:var(--ink);border-left:3px solid var(--accent-2);padding-left:18px;margin:0}
.hero-img{background:var(--paper);border-radius:22px;padding:18px;box-shadow:var(--shadow);transform:rotate(1.2deg)}
.photo{position:relative;justify-self:center;width:min(340px,100%)}
.photo img{border-radius:24px;box-shadow:var(--shadow);aspect-ratio:3/4;object-fit:cover;width:100%;background:#eee}
.photo:before{content:"";position:absolute;inset:18px -18px -18px 18px;border-radius:24px;background:linear-gradient(135deg,var(--c-doc-soft),var(--c-inv-soft),var(--c-pro-soft));z-index:-1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:40px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.stat b{display:block;font-family:var(--serif);font-size:1.9rem;font-weight:600;color:var(--accent);line-height:1.2}
.stat span{font-size:.85rem;color:var(--muted)}
@media (max-width:860px){.hero .grid{grid-template-columns:1fr}.hero-img{transform:none;max-width:460px}.stats{grid-template-columns:repeat(2,1fr)}.photo{order:-1;width:220px;justify-self:start}}

/* sections */
section.s{padding:80px 0;border-top:1px solid var(--line)}
section.s.alt{background:var(--paper)}
.s-head{display:flex;align-items:baseline;gap:16px;margin-bottom:26px}
.s-num{font-family:var(--serif);font-size:1rem;color:var(--accent);font-weight:600;min-width:2ch}
.intro{max-width:740px;color:var(--ink-2);font-size:1.06rem}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
.cards{display:grid;gap:18px}
.c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.c4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){.c2,.c3{grid-template-columns:1fr}}
@media (max-width:560px){.c4{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}
.alt .card{background:var(--bg)}
.card h3{margin-bottom:8px}
.card p.m{color:var(--ink-2);font-size:.96rem}
.tag{display:inline-block;font-size:.74rem;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin:0 6px 8px 0}
.tag.warm{background:var(--warm-soft);color:var(--warm)}
.kv{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;color:var(--muted);margin-top:10px}
.kv b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font-size:.85rem;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper)}
.chip.done{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.split{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:start;margin-top:30px}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.callout{border-left:3px solid var(--warm);background:var(--warm-soft);padding:14px 18px;border-radius:0 10px 10px 0;margin:18px 0;color:var(--ink-2);font-size:.97rem}
.callout b{color:var(--warm)}
.callout.ok{border-color:var(--accent);background:var(--accent-soft)}
.callout.ok b{color:var(--accent)}
.note{font-size:.84rem;color:var(--muted);margin-top:8px}

/* home branches */
.branches{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:28px}
.branch{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s;position:relative;overflow:hidden}
.branch:before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--bc)}
.branch:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(20,33,61,.12)}
.branch .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--bs);font-size:1.4rem;margin-bottom:14px}
.branch h3{font-size:1.5rem;margin-bottom:8px}
.branch p{color:var(--ink-2);font-size:.96rem;flex:1}
.branch .bst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 16px}
.branch .bst b{display:block;white-space:nowrap;font-family:var(--serif);font-size:1.25rem;color:var(--bc);line-height:1.2}
.branch .bst span{font-size:.74rem;color:var(--muted);line-height:1.3;display:block}
.branch .go{font-weight:600;font-size:.9rem;color:var(--bc)}
@media (max-width:1000px){.branches{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.branches{grid-template-columns:1fr}}
.tlfilter{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 26px;align-items:center}
.tlfilter span{font-size:.86rem;color:var(--muted);margin-right:4px}
.tlfilter button{appearance:none;border:1px solid var(--line);background:var(--paper);font:inherit;font-size:.84rem;padding:5px 13px;border-radius:999px;cursor:pointer;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.tlfilter button i{width:8px;height:8px;border-radius:50%}
.tlfilter button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.career{position:relative;padding-left:0}
.career .row{display:grid;grid-template-columns:92px 22px 1fr;gap:0 14px;align-items:start;padding:6px 0;transition:opacity .3s}
.career .row.dim{opacity:.18}
.career .y{font-family:var(--serif);font-weight:600;text-align:right;padding-top:2px;color:var(--ink-2);font-size:.98rem}
.career .dot{position:relative;height:100%}
.career .dot:before{content:"";position:absolute;left:10px;top:0;bottom:-12px;width:2px;background:var(--line)}
.career .row:last-child .dot:before{display:none}
.career .dot i{position:absolute;left:4px;top:6px;width:14px;height:14px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--bc)}
.career .dot i{background:var(--bc)}
.career .tx{padding-bottom:14px}
.career .tx b{font-family:var(--serif);font-size:1.08rem;font-weight:600}
.career .tx span{display:block;font-size:.92rem;color:var(--muted)}
.contact{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.contact a{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--paper);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:500;font-size:.92rem;transition:border-color .2s}
.contact a:hover{border-color:var(--accent)}
.email{font-family:var(--serif);font-size:1.4rem;color:var(--ink);font-weight:600;word-break:break-all}
.copy{appearance:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;font:inherit;font-size:.8rem;padding:4px 12px;cursor:pointer;margin-left:10px;vertical-align:middle}

/* timeline small */
.timeline{position:relative;margin:6px 0 8px;padding-left:28px}
.timeline:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--accent-2),var(--accent))}
.tl{position:relative;margin-bottom:20px}
.tl:before{content:"";position:absolute;left:-27px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:3px solid var(--accent)}
.tl .when{font-size:.8rem;font-weight:600;color:var(--accent);letter-spacing:.05em}
.tl h3{font-size:1.08rem;margin:2px 0 4px}
.tl p{color:var(--ink-2);margin:0;font-size:.96rem}
.course{display:flex;flex-direction:column}
.course .code{font-family:var(--serif);font-size:1.6rem;font-weight:700;color:var(--accent);line-height:1}
.course.theory .code{color:var(--warm)}
.course h3{font-size:1.02rem;margin:6px 0 4px;font-family:var(--sans);font-weight:600}
.course p{font-size:.9rem;color:var(--ink-2);margin:8px 0 0}

.principles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.pr{padding:20px;border-radius:var(--radius);background:var(--accent-soft)}
.pr .ic{font-size:1.5rem}
.pr h3{font-size:1.08rem;margin:8px 0 6px}
.pr p{font-size:.93rem;color:var(--ink-2);margin:0}
.pr .tags{margin-top:12px}
@media (max-width:820px){.principles{grid-template-columns:1fr}}
.c4.principles{grid-template-columns:repeat(4,1fr)}
@media (max-width:980px){.c4.principles{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.c4.principles{grid-template-columns:1fr}}
.minitag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--paper);color:var(--accent);margin:4px 4px 0 0;font-weight:600}

.evo{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:10px}
.evo li{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:.96rem;color:var(--ink-2);display:flex;gap:12px;align-items:flex-start;animation:fadeIn .4s ease both}
.alt .evo li{background:var(--bg)}
.evo li span{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;background:var(--accent-soft);color:var(--accent);font-weight:700}
.evo.past li span{background:#ece8de;color:var(--muted)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* stepper */
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:26px 0 16px}
.step{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);transition:all .25s}
.step small{display:block;color:var(--muted);font-size:.75rem;font-weight:600;letter-spacing:.06em}
.step strong{font-family:var(--serif);font-size:1.05rem;font-weight:600}
.step:hover{border-color:var(--accent-2)}
.step[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.step[aria-selected=true] small{color:#9fe5dc}
.step-panel{background:var(--bg);border-radius:var(--radius);padding:22px 24px;border:1px solid var(--line);min-height:110px}
@media (max-width:720px){.stepper{grid-template-columns:repeat(2,1fr)}}

figure{margin:0}
.fig{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.fig img{border-radius:8px;cursor:zoom-in;margin:0 auto}
.fig figcaption{font-size:.86rem;color:var(--muted);margin-top:10px;line-height:1.5}
.fig figcaption b{color:var(--ink-2)}
.toggle{display:inline-flex;background:#ece8de;border-radius:999px;padding:4px;margin-bottom:12px;flex-wrap:wrap}
.toggle button{appearance:none;border:0;background:transparent;font:inherit;font-size:.88rem;font-weight:500;padding:7px 16px;border-radius:999px;cursor:pointer;color:var(--ink-2)}
.toggle button[aria-pressed=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.swap img{transition:opacity .35s}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:26px 0 22px;overflow-x:auto}
.tabs button{appearance:none;border:0;background:none;font:inherit;font-weight:500;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
.tabpanel[hidden]{display:none}
.cycle{display:grid;grid-template-columns:repeat(4,1fr);margin:26px 0}
.cy{position:relative;padding:18px;background:var(--bg);border:1px solid var(--line);margin-right:18px;border-radius:12px}
.cy:after{content:"→";position:absolute;right:-17px;top:50%;transform:translateY(-50%);color:var(--accent);font-weight:700}
.cy:last-child{margin-right:0}.cy:last-child:after{content:"↺";top:-14px;right:10px;transform:none;font-size:1.2rem}
.cy b{display:block;font-family:var(--serif);font-size:1.02rem;margin-bottom:4px}
.cy span{font-size:.9rem;color:var(--ink-2)}
@media (max-width:820px){.cycle{grid-template-columns:1fr;gap:12px}.cy{margin-right:0}.cy:after{content:"↓";right:auto;left:50%;top:auto;bottom:-20px;transform:translateX(-50%)}.cy:last-child:after{display:none}}

.meters{display:grid;gap:18px}
.meter .top{display:flex;justify-content:space-between;font-size:.95rem;margin-bottom:6px;gap:12px}
.meter .top b{font-family:var(--serif);font-size:1.15rem;color:var(--accent);white-space:nowrap}
.bar{height:12px;background:#ece8de;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:999px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.bar i.warm{background:linear-gradient(90deg,var(--warm),#f59e0b)}
.meter p{font-size:.86rem;color:var(--muted);margin:6px 0 0}
.chart{position:relative}
.chart svg{width:100%;height:auto;overflow:visible}
.chart .pt{cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:.82rem;padding:8px 11px;border-radius:8px;opacity:0;transition:opacity .15s;transform:translate(-50%,-115%);white-space:nowrap}
.quote{font-family:var(--serif);font-size:1.28rem;line-height:1.45;margin:0;padding:26px 30px;background:var(--ink);color:#fff;border-radius:var(--radius);min-height:150px}
.quote:before{content:"“";font-size:3rem;line-height:0;vertical-align:-.4em;color:var(--accent-2);margin-right:4px}
.quote cite{display:block;font-family:var(--sans);font-style:normal;font-size:.82rem;color:#b8c1d4;margin-top:12px}
.qnav{display:flex;gap:8px;margin-top:12px}
.qnav button{width:10px;height:10px;border-radius:50%;border:0;background:#cfc9bb;cursor:pointer;padding:0}
.qnav button[aria-current=true]{background:var(--accent)}

details.pl{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.alt details.pl{background:var(--bg)}

<script>

function vStudy(){
  var S=T.study,h='';
  h+='<header class="hero"><div class="wrap"><div class="grid"><div><div class="eyebrow">'+S.eyebrow+'</div><h1>'+S.title+'</h1><p class="lead" style="margin-top:22px">'+S.lead+'</p></div>'+heroPhoto('fs-driverless-2019','tall')+'</div>'+stats(S.stats)+'</div></header>';
  h+=sec('f-titulaciones',S.degShort,'<div class="s-head reveal"><h2>'+S.degTitle+'</h2></div><div class="timeline reveal" style="margin-top:20px">'+T.prof.edu.map(function(e){return '<div class="tl"><div class="when">'+e.y+' · '+e.w+'</div><h3>'+e.t+'</h3><p>'+e.p+'</p></div>'}).join('')+'</div>',true);
  h+=sec('f-grado',S.gradoShort,'<div class="s-head reveal"><h2>'+S.gradoTitle+'</h2></div><p class="intro reveal">'+S.gradoIntro+'</p>'+['p1','p2','tfg'].map(studyCard).join(''),false);
  h+=sec('f-master',S.masterShort,'<div class="s-head reveal"><h2>'+S.masterTitle+'</h2></div><p class="intro reveal">'+S.masterIntro+'</p>'+['fs','tfm'].map(studyCard).join(''),true);
  h+=sec('f-doctorado',S.phdShort,'<div class="s-head reveal"><h2>'+S.phdTitle+'</h2></div><p class="intro reveal">'+S.phdP+'</p><p class="reveal"><a href="#investigacion" style="font-weight:600">'+S.phdLink+' →</a></p>',false);
  return h;
}

/* ---------- interactions ---------- */
function bind(){
  timers.forEach(clearInterval); timers=[];
  var app=document.getElementById('app');
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;e.target.classList.add('in');e.target.querySelectorAll('.bar i').forEach(function(b){b.style.width=b.dataset.w+'%'});io.unobserve(e.target)})},{threshold:.1});
  app.querySelectorAll('.reveal').forEach(function(el){io.observe(el)});
  // home timeline filter
  app.querySelectorAll('.tlfilter button').forEach(function(b,_,all){b.addEventListener('click',function(){[].forEach.call(all,function(x){x.setAttribute('aria-pressed',x===b)});var k=b.dataset.b;app.querySelectorAll('.career .row').forEach(function(r){r.classList.toggle('dim',k!=='all'&&r.dataset.b.split(' ').indexOf(k)<0)})})});
  // copy
  app.querySelectorAll('[data-copy]').forEach(function(b){b.addEventListener('click',function(){try{navigator.clipboard.writeText(b.dataset.copy).then(function(){b.textContent='✓';setTimeout(function(){b.textContent='⧉'},1500)},function(){})}catch(e){}})});
  // stepper
  var panel=app.querySelector('.step-panel');
  if(panel){var steps=T.teach.s3.steps,sb=[].slice.call(app.querySelectorAll('.step'));
    var show=function(i){sb.forEach(function(b,j){b.setAttribute('aria-selected',j===i)});panel.innerHTML='<h3 style="font-size:1.12rem;margin-bottom:6px">'+steps[i].t+'</h3><p style="margin:0;color:var(--ink-2)">'+steps[i].d+'</p>'};
    sb.forEach(function(b,i){b.addEventListener('click',function(){show(i)})});show(0);}
  // evo
  var evoT=app.querySelector('.evo-t');
  if(evoT){var el=app.querySelector('.evo'),eb=[].slice.call(evoT.querySelectorAll('button')),evo=T.teach.s2.evo;
    var es=function(k){eb.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.k==k)});el.className='evo'+(k==0?' past':'');el.innerHTML=evo[k].map(function(t,i){return '<li style="animation-delay:'+(i*60)+'ms"><span>'+(k==0?'·':'✓')+'</span>'+t+'</li>'}).join('')};
    eb.forEach(function(b){b.addEventListener('click',function(){es(+b.dataset.k)})});es(0);}
  // image toggles
  app.querySelectorAll('.img-t').forEach(function(g){var img=g.nextElementSibling.querySelector('img'),bs=[].slice.call(g.querySelectorAll('button'));
    bs.forEach(function(b){b.addEventListener('click',function(){bs.forEach(function(x){x.setAttribute('aria-pressed',x===b)});img.style.opacity=0;setTimeout(function(){img.src=b.dataset.src;img.style.opacity=1},180)})})});
  // tabs
  var tabs=[].slice.call(app.querySelectorAll('.tabs [role=tab]'));
  tabs.forEach(function(t){t.addEventListener('click',function(){tabs.forEach(function(x){x.setAttribute('aria-selected',x===t)});app.querySelectorAll('.tabpanel').forEach(function(p){p.hidden=p.dataset.p!==t.dataset.t})})});
  // chart
  var ch=app.querySelector('.chart');
  if(ch){var data=D.ratings,W=520,H=280,L=46,R=20,Tp=20,B=40,lo=4,hi=5;
    var x=function(i){return L+30+(W-L-R-60)*(i/(data.length-1))},y=function(v){return Tp+(H-Tp-B)*(1-(v-lo)/(hi-lo))};
    var dec=function(n){return lang==='en'?n.toFixed(2):n.toFixed(2).replace('.',',')};
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img">';
    [4,4.25,4.5,4.75,5].forEach(function(g){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="#e4e0d6"/><text x="'+(L-10)+'" y="'+(y(g)+4)+'" text-anchor="end" font-size="11" fill="#6b7488">'+dec(g)+'</text>'});
    var path=data.map(function(d,i){return (i?'L':'M')+x(i)+' '+y(d.v)}).join(' ');
    s+='<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14b8a6" stop-opacity=".25"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></linearGradient></defs>';
    s+='<path d="'+path+' L'+x(data.length-1)+' '+y(lo)+' L'+x(0)+' '+y(lo)+' Z" fill="url(#ga)"/><path d="'+path+'" fill="none" stroke="#0f766e" stroke-width="2.5"/>';
    data.forEach(function(d,i){s+='<text x="'+x(i)+'" y="'+(H-14)+'" text-anchor="middle" font-size="12" fill="#3b4660">'+d.y+'</text><text x="'+x(i)+'" y="'+(y(d.v)-14)+'" text-anchor="middle" font-size="13" font-weight="600" fill="#14213d">'+dec(d.v)+'</text><circle class="pt" data-i="'+i+'" cx="'+x(i)+'" cy="'+y(d.v)+'" r="7" fill="#fff" stroke="#0f766e" stroke-width="3" tabindex="0"/>'});
    ch.insertAdjacentHTML('beforeend',s+'</svg>');var tip=ch.querySelector('.tip');
    ch.querySelectorAll('.pt').forEach(function(c){var on=function(){var d=data[c.dataset.i],r=c.getBoundingClientRect(),cr=ch.getBoundingClientRect();tip.innerHTML='<b>'+d.y+'</b> · '+dec(d.v)+' / 5<br>'+T.teach.s5.part+': '+dec(d.p)+' %';tip.style.left=(r.left-cr.left+r.width/2)+'px';tip.style.top=(r.top-cr.top)+'px';tip.style.opacity=1},off=function(){tip.style.opacity=0};
      c.addEventListener('mouseenter',on);c.addEventListener('focus',on);c.addEventListener('click',on);c.addEventListener('mouseleave',off);c.addEventListener('blur',off)});}
  // quotes
  var qel=app.querySelector('.quote');
  if(qel){var qn=app.querySelector('.qnav'),qi=0;var qs=function(i){qi=i;qel.innerHTML=T.teach.s5.quotes[i]+'<cite>'+T.teach.s5.quoteCite+'</cite>';[].forEach.call(qn.children,function(b,j){b.setAttribute('aria-current',j===i)})};
    var rs=function(){timers.forEach(clearInterval);timers=[setInterval(function(){qs((qi+1)%T.teach.s5.quotes.length)},8000)]};
    T.teach.s5.quotes.forEach(function(_,i){var b=document.createElement('button');b.setAttribute('aria-label',String(i+1));b.addEventListener('click',function(){qs(i);rs()});qn.appendChild(b)});qs(0);rs();}
  // pubs filter
  app.querySelectorAll('.pubf button').forEach(function(b,_,all){b.addEventListener('click',function(){[].forEach.call(all,function(x){x.setAttribute('aria-pressed',x===b)});app.querySelectorAll('.pub').forEach(function(p){p.hidden=b.dataset.f!=='all'&&p.dataset.t!==b.dataset.f})})});
  // exp more
  app.querySelectorAll('.xpc .more').forEach(function(b){b.addEventListener('click',function(){var ul=b.previousElementSibling,h=ul.classList.toggle('hide');b.textContent=h?T.ui.more+' ↓':T.ui.less+' ↑'})});
  // lightbox
  app.querySelectorAll('.fig img').forEach(function(im){im.addEventListener('click',function(){openLB(im.src,false,im.dataset.cap||im.alt)})});
  app.querySelectorAll('.hphoto').forEach(function(f){f.addEventListener('click',function(){var id=f.dataset.m;openLB('media/'+id+'.jpg',false,T.media[id]||'')})});
  app.querySelectorAll('.mfig .mm').forEach(function(mm){mm.addEventListener('click',function(){var id=mm.parentNode.dataset.m;openLB('media/'+id+(D.media[id].v?'.mp4':'.jpg'),!!D.media[id].v,T.media[id]||'')})});
  // platform cards
  app.querySelectorAll('.platcard').forEach(function(pc){var st=pc.querySelector('.stage'),cap=pc.querySelector('.cap');if(!st)return;
    var show=function(id){st.dataset.m=id;var m=D.media[id];st.innerHTML=m.v?'<video src="media/'+id+'.mp4" poster="media/'+id+'.jpg" muted loop playsinline autoplay preload="metadata"></video>':'<img src="media/'+id+'.jpg" alt="'+(T.media[id]||'').replace(/"/g,'&quot;')+'">';cap.textContent=T.media[id]||'';
      pc.querySelectorAll('.thumbs button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.m===id)})};
    pc.querySelectorAll('.thumbs button').forEach(function(b){b.addEventListener('click',function(){show(b.dataset.m)})});
    st.addEventListener('click',function(){var id=st.dataset.m;openLB('media/'+id+(D.media[id].v?'.mp4':'.jpg'),!!D.media[id].v,T.media[id]||'')});
    show(st.dataset.m)});
}
function openLB(src,isVid,cap){var lb=document.getElementById('lb');var old=lb.querySelector('img,video');var el;
  if(isVid){el=document.createElement('video');el.src=src;el.controls=true;el.autoplay=true;el.loop=true;el.muted=true;el.setAttribute('playsinline','');}else{el=document.createElement('img');el.src=src;el.alt=cap;}
  el.addEventListener('click',function(e){if(isVid)e.stopPropagation()});
  old.replaceWith(el);lb.querySelector('p').textContent=cap;lb.classList.add('on')}

/* ---------- render & routing ---------- */
var subSecs=[];
function render(keepScroll){
  T=window.I18N[lang]||window.I18N.es;
  document.documentElement.lang=lang;document.title=T.meta.title;
  document.body.dataset.view=view;
  document.getElementById('views').innerHTML=VIEWS.map(function(v){return '<a href="#'+v+'" class="'+(v===view?'on':'')+'">'+(COL[v]?'<i style="background:'+COL[v]+'"></i>':'')+T.ui.nav[v]+'</a>'}).join('');
  document.querySelectorAll('#langs button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.l===lang)});
  var y=window.scrollY;
  document.getElementById('app').innerHTML=view==='docencia'?vTeach():view==='investigacion'?vResearch():view==='profesional'?vProf():view==='formacion'?vStudy():vHome();
  document.getElementById('foot').innerHTML=T.ui.footer;
  subSecs=[].slice.call(document.querySelectorAll('#app section[data-sub]'));
  var sn=document.getElementById('subnav');sn.classList.toggle('on',view!=='inicio');
  document.getElementById('subList').innerHTML=view==='inicio'?'':subSecs.map(function(s,i){return '<li><button data-i="'+i+'">'+s.dataset.sub+'</button></li>'}).join('');
  document.querySelectorAll('#subList button').forEach(function(b){b.addEventListener('click',function(){var s=subSecs[+b.dataset.i];window.scrollTo({top:s.getBoundingClientRect().top+window.scrollY-110,behavior:'smooth'})})});
  bind();
  window.scrollTo(0,keepScroll?y:0);
  onScroll();
}
function onScroll(){
  var h=document.documentElement,max=h.scrollHeight-h.clientHeight;document.getElementById('progress').style.width=(max>0?h.scrollTop/max*100:0)+'%';
  var cur=-1;subSecs.forEach(function(s,i){if(s.getBoundingClientRect().top<140)cur=i});
  var bs=document.querySelectorAll('#subList button');bs.forEach(function(b,i){b.classList.toggle('on',i===cur)});
  if(cur>=0&&bs[cur]){var ul=document.getElementById('subList'),r=bs[cur].getBoundingClientRect(),u=ul.getBoundingClientRect();if(r.left<u.left||r.right>u.right)ul.scrollLeft+=r.left-u.left-20}
}
window.addEventListener('scroll',onScroll,{passive:true});
function route(){var v=(location.hash||'').replace('#','');view=VIEWS.indexOf(v)>=0?v:'inicio';render(false)}
window.addEventListener('hashchange',route);
document.querySelectorAll('#langs button').forEach(function(b){b.addEventListener('click',function(){lang=b.dataset.l;try{localStorage.setItem('cc-lang',lang)}catch(e){}render(true)})});
var lb=document.getElementById('lb');function closeLB(){lb.classList.remove('on');var v=lb.querySelector('video');if(v){v.pause();v.replaceWith(document.createElement('img'))}}lb.addEventListener('click',closeLB);document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLB()});
route();
})();
</script>
</body>
</html>
